<style>

/* ---- 澶撮儴 ---- */
/* 澶撮儴閫氭爮鐩磋锛氬渾瑙掍細鍦ㄤ笅鏂瑰乏鍙充袱瑙掔暀鍑虹己鍙ｏ紙搴曡壊閫忓嚭鏉ワ級锛?   涓庝笅闈㈠唴瀹瑰尯鐨勭洿瑙掑崱鐗囨斁鍦ㄤ竴璧锋樉寰楁病瀵归綈锛屾墍浠ヨ繖閲屾槸鐭╁舰銆?*/

/* ---- 鐗堝潡鍒囨崲 ---- */
/* 褰撳墠鎵€鍦ㄧ増鍧楃敤銆屽疄蹇冪传搴?+ 鍐呴槾褰便€嶅己璋冿細瀹炲績搴曡壊鍦ㄤ竴鎺掔櫧鑳跺泭閲屾渶鎶撶溂锛?   鍜屽唴闃村奖涓€璧锋瀯鎴愯交寰殑銆屾寜涓嬪幓銆嶆劅锛屽拰澶撮儴娓愬彉鍚岃壊绯汇€?   涓嶇敤杈规棰滆壊鏄洜涓鸿竟妗嗗湪娴呰壊鑳屾櫙涓婂姣斿害涓嶈冻锛岃繙鐪嬪垎涓嶅嚭鏉ャ€?*/
.tabs{
  display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px;
}
.tabs a{
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  box-shadow:var(--shadow);padding:8px 20px;text-decoration:none;
  font-size:14px;font-weight:700;color:var(--ink2);
  transition:border-color .15s,color .15s,background .15s,box-shadow .15s;
}
.tabs a:hover{border-color:var(--purple);color:var(--purple);background:var(--purple-soft)}
.tabs a.active{
  background:var(--purple);border-color:var(--purple);color:#fff;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.22),0 2px 8px rgba(127,5,133,.28);
}
.tabs a.active:hover{background:#6d0472;color:#fff}

/* ---- 搴忚█ ---- */
.preface{

  padding:18px 20px;margin:0 0 22px;box-shadow:var(--shadow);
}

  margin:0 0 8px;

/* ---- 鏈€杩戞洿鏂?---- */
/* 鐢ㄦ埛 m10946锛氥€屻€庡簭瑷€銆忚繖涓€鏍忎笅鏂规柊澧炰竴鏍忋€庢渶杩戞洿鏂般€忥紝閲岄潰鏀炬渶杩戞洿鏂扮殑鑻ュ共绡囨枃绔犵殑
   鏍囬鎴?doi锛屽叾閾炬帴鍒版湰椤甸潰涓嬫柟瀵瑰簲鏂囩珷鍗＄墖澶勩€傘€嶆牱寮忎笌銆屽簭瑷€銆嶅悓涓€鍓鏋讹紝
   杩欐牱鎻掑湪涓ゅ潡涔嬮棿涓嶄細鏄惧緱鏄彟涓€涓珯鐨勪笢瑗裤€?*/
.recent{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin:0 0 22px;box-shadow:var(--shadow);
}
.recent .h{

/* 鏃ユ湡鍋氭垚瀹氬灏忔爣绛撅細闀跨煭涓嶄竴鐨勬爣棰橀潬瀹冨榻愶紝涓€鐪艰兘姣斿嚭鏂版棫銆?*/
.recent .d{
  flex:none;width:76px;font-size:12px;font-weight:700;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.recent a{
  color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.6;
  border-bottom:1px solid transparent;
}

@media (max-width:560px){

/* ---- QRL 鍠滄姤鍗＄墖 ---- */
/* 鐢ㄦ埛 m07802 褰撴椂瑕併€岀孩閲戝湡鍛冲ぇ鍗＄墖銆嶏紝缁忚繃 m10591锛堝幓绾㈠簳锛夈€乵10946锛堥€忔槑妗嗭級銆?   鍒?m11527 鏈€缁堝畾涓猴細**涓庣珯鍐呭叾瀹冨崱鐗囧悓娆剧殑鐧藉簳鍗＄墖**锛屽彧鐣欎竴琛屽ぇ瀛楃殑鏍囬銆?   鎵€浠ヨ繖閲屼笉鍐嶆湁鑳屾櫙鍥俱€佺孩閲戞笎鍙樸€佺儷閲戝寘瑙掋€佺伅绗尖€斺€斾竴寮犳櫘閫氬崱鐗囷紝闈犲瓧鎾戜綇瑙嗚銆?*/
.gongxi{
  position:relative;margin:0 0 24px;padding:30px 26px;text-align:center;
  border-radius:var(--radius);overflow:hidden;isolation:isolate;
  /* 鐢ㄦ埛 m11527锛氥€岃娓呯┖鑳屾櫙鍥撅紝淇濇寔涓庡叾浠栧崱鐗囩浉鍚岀殑鐧借壊搴曡壊銆?*/
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
  /* 涓庢棫鐗堝悓楂橈細鎹㈣璁′笉鎹㈠崰浣嶏紝椤甸潰涓嶄細鍥犱负鍘绘帀鑳屾櫙鍥捐€岀缉鐭?*/
  min-height:250px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.gongxi .gt{
  margin:0;font-size:clamp(30px,5.4vw,64px);line-height:1.16;font-weight:900;
  letter-spacing:2px;
  /* 鍏滃簳鑹诧細涓囦竴娴忚鍣ㄤ笉鏀寔 background-clip:text锛岃繕鏄湁涓€琛屽疄鑹插瓧锛屼笉浼氬彉閫忔槑 */
  color:#d92b7a;
}
/* 鐢ㄦ埛 m11527锛氥€屾垜闇€瑕佺殑鏄枩鍚戞笎鍙樼殑鏁堟灉锛岃€屼笉鏄€愬瓧娓愬彉锛涘苟涓旓紝浣滀负 gif锛?   搴斿綋鏈夋笎鍙樻晥鏋滃悜鍙虫祦鍔ㄧ殑鍔ㄧ敾鏁堟灉銆嶃€?
   鍋氭硶锛氭暣琛屽瓧鐢?*涓€鏉℃枩鍚戞笎鍙?*锛?15deg锛屽乏涓娾啋鍙充笅锛夛紝鍐嶇敤 background-clip:text
   鎶婃笎鍙樿杩涘瓧褰紱鍔ㄧ敾鍙钩绉?background-position锛屼竴涓瓧涓€涓鑹查偅绉嶅啓娉曞凡缁忓垹鎺夈€?
   涓轰粈涔堟笎鍙橀灏剧敤鍚屼竴涓壊锛氬姩鐢昏鎶婅儗鏅暣鏁村钩绉讳竴涓€屽浘瀹姐€嶏紝棣栧熬涓嶅悓鑹茬殑璇?   姣忎竴杞洖鍒拌捣鐐逛細鐪嬪埌涓€娆＄‖璺炽€傞灏惧悓鑹?+ background-size:200% + 骞崇Щ -200%锛?   姝ｅソ鏄竴涓畬鏁村懆鏈燂紝鎺ョ紳涓嶅彲瑙併€?*/
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .gongxi .gt{
    /* 涓€鏉℃枩鍚戝僵铏癸紙115deg锛氬乏涓?鈫?鍙充笅锛夈€傞灏鹃兘钀藉湪 #ff3d3d 涓婏紝
       杩欐牱鑳屾櫙鏁村潡骞崇Щ涓€涓浘瀹戒箣鍚庤兘鏃犵紳鎺ュ洖鑷繁銆?*/
    background-image:linear-gradient(115deg,
      #ff3d3d 0%, #ff8a2b 9%, #ffd23d 18%, #b6f24a 27%,
      #3ce8b0 36%, #35b6f0 45%, #4a6bff 54%, #9a4dff 63%,
      #e04df0 72%, #ff4d9d 81%, #ff6a5c 90%, #ff3d3d 100%);
    background-size:200% 100%;
    background-repeat:repeat;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    /* 鑳屾櫙鍥炬暣浣撳悜鍙虫尓涓€涓浘瀹斤紙=-200% 浣嶇疆锛夛紝棰滆壊鐪嬭捣鏉ュ氨鏄線鍙虫祦銆?       鍥惧鏄厓绱犵殑 2 鍊嶏紝鎵€浠ヤ竴姝ユ濂借蛋瀹屼竴涓畬鏁存笎鍙樺懆鏈熴€?*/
    animation:gongxi-flow 6s linear infinite;
  }
}
/* 棣栧熬鍚岃壊锛屾墍浠?-200% 涓?0 鏄悓涓€甯э紝寰幆澶勬病鏈夎烦鍙樸€?*/
@keyframes gongxi-flow{
  from{background-position:0% 50%}
  to{background-position:-200% 50%}
}
/* 灏婇噸绯荤粺鐨勩€屽噺灏戝姩鎬佹晥鏋溿€嶏細娓愬彉鐣欑潃锛屽姩鐢诲仠鎺夈€?   杩欑被绾楗扮殑娴佸姩鏁堟灉鏄墠搴晱鎰熶汉缇ゆ渶瀹规槗琚奖鍝嶇殑閭ｄ竴绫汇€?*/
@media (prefers-reduced-motion:reduce){
  .gongxi .gt{animation:none!important}
}

   涓夋爮浣嶇疆鏈韩琛ㄨ揪鏂版棫椤哄簭锛氬乏锛濇渶鏂帮紝涓紳涓婁竴杞紝鍙筹紳鍐嶄笂涓€杞€?   鎵€浠ヨ繖閲?*鍒绘剰**鍐欐 repeat(3,1fr) 鑰屼笉鏄?auto-fit鈥斺€旀湡鏁颁笉澶熸椂瀹佸彲鐣欑┖妲斤紝

   浣嶇疆灏变笉鍐嶆惡甯︺€岃繖鏄鍑犳柊銆嶇殑淇℃伅浜嗐€?*/
.recent3{

/* 瑙掓爣锛氭瘮鍗＄墖鍖哄叾瀹冩爣绛惧ぇ涓€妗ｏ紝鍦嗚鏀舵暃鎴愭柟妗嗚€屼笉鏄兌鍥?   锛堟柟妗嗗湪鍗＄墖鍙充笂瑙掓洿鍍忓嵃绔狅紝鑳跺泭澶渾浼氭樉寰楄蒋锛夈€?   閫夋嫨鍣ㄨ鍐欐垚 .recent3 .cardlink .cl-b 涓夌骇鈥斺€旈€氱敤鐨?.cardlink .cl-b 瀹氫箟鍦ㄤ笅闈紝
   鏉冮噸鐩稿悓鑰屼綅缃洿闈犲悗锛屼袱绾ч€夋嫨鍣ㄤ細琚畠鐩栨帀銆?*/

   涓枃鍥為€€鍒扮郴缁熷瓧浣擄紝閬垮厤 Times 缂哄瓧鏃惰楂樿烦鍙樸€?*/
/* 瀛椾綋涓庛€?026銆嶆爮閲岀殑鏈堜唤鍗＄墖鏍囬锛?mtxt b锛変繚鎸佷竴鑷达細鍚屼竴濂楁棤琛嚎瀛椾綋銆?   鍚屼负 700 鍔犵矖锛屽厤寰楀悓涓€涓〉闈㈤噷涓ょ绗旇Е鎵撴灦銆傚瓧鍙蜂粛姣旀鏂囧ぇ涓€鍙凤紝鐢ㄦ潵
   鎵挎媴銆岃繖鏄釜鏃ユ湡銆嶇殑瑙嗚閲嶉噺銆?*/

   榛樿鍗曟爮锛氭棩鎶ヤ竴鏈熼€氬父鍙湁鍑犵瘒锛屽弻鏍忎細鎶婃瘡鏉℃尋绐勩€佽鎽樿鏃惰绾挎潵鍥炶烦銆?   鏈堟姤/涓撻涓€娆″嚑鍗佺瘒锛屾墠鐢ㄥ弻鏍忥紙鐢?.entries.two 寮€鍚級銆?*/
.entries{

<p class="teaser">鍒╃敤绂诲煙閲忓瓙鎺㈤拡娴嬮噺鍦扮悆灞€閮ㄥ紩鍔涘満锛岀簿搴﹂殢娉㈠嚱鏁颁袱鍒嗛噺闂磋窛鐨勫钩鏂规彁鍗囷紝瀹為檯浣嶇疆娴嬮噺涓嬫€ц兘鐩稿鏈€缁堟瀬闄愮殑涓嬮檷涓嶈冻涓€涓暟閲忕骇锛屽苟璇佹槑g涓巑鑱斿悎浼拌鐨勯澶栧櫔澹板彲浠ュ拷鐣ャ€?/p>
<p class="body">鎴戜滑鐮旂┒鍒╃敤閲忓瓙鎺㈤拡绮剧‘娴嬪畾鍦扮悆灞€閮ㄥ紩鍔涘満寮哄害銆傜爺绌剁粨鏋滆〃鏄庯紝绂诲煙鎺㈤拡閫氬父浼樹簬灞€鍩熸帰閽堬紝鍏剁簿搴︽彁鍗囬殢娉㈠嚱鏁颁袱鍒嗛噺涔嬮棿闂磋窛鐨勫钩鏂瑰闀裤€傝繖绉嶄紭鍔垮湪鐪熷疄浣嶇疆娴嬮噺涓嬩緷鐒跺瓨鍦紝姝ゆ椂鎬ц兘鐩稿鏈€缁堟瀬闄愮殑涓嬮檷涓嶅埌涓€涓暟閲忕骇銆傛垜浠繕璁ㄨ浜嗗湴鐞冭〃闈㈢殑褰卞搷锛岃瘉鏄庡叾鏁堝簲鍦ㄧ矑瀛愯惤鍒板湴闈箣鍓嶄笉涔呬互鍓嶉兘鍙互蹇界暐銆傛渶鍚庯紝鎴戜滑澶勭悊浜嗗紩鍔涘姞閫熷害g涓庢帰閽堣川閲弇鐨勮仈鍚堜及璁★紝璇佹槑鐢变簩鑰呭唴鍦ㄤ笉鐩稿鎬у紩璧风殑棰濆浼拌鍣０鍙互蹇界暐銆?/p><details><summary>Abstract (English)</summary><div class="en-abs">We investigate the use of quantum probes to accurately determine the strength of the local gravitational field on Earth. Our findings show that delocalized probes generally outperform localized ones, with the precision enhancement scaling quadratically with the separation between the two wavefunction components. This advantage persists under realistic position measurements, where performance are degraded by less than one order of magnitude with respect to the ultimate bound. We also discuss the influence of Earth鈥檚 surface, demonstrating that its effect can be neglected until shortly before the particle hits the floor. Finally, we address the joint estimation of the gravitational acceleration g and the probe mass m , proving that the excess estimation noise arising from their inherent incompatibility is negligible.</div></details>

<p class="teaser">灏嗛暱绋嬬浉浜掍綔鐢ㄩ噺瀛愪紛杈涙ā鍨嬫嫇灞曞埌寮€鏀剧郴缁燂紝鍙戠幇闀跨▼浣滅敤鏃㈣兘绋冲畾閾佺鐣淬€佹姂鍒跺櫔澹帮紝鍙堜娇姣忎釜鑷棆闂存帴鏆撮湶浜庢洿澶х幆澧冭€屽姞閫熻蹇嗕抚澶憋紝寮辫€楁暎涓嬪憟鐜颁緷璧栧垵鎬佺殑涓板瘜寮涜鲍鍔ㄥ姏瀛︺€?/p>
<p class="body">闀跨▼鐩镐簰浣滅敤妯″瀷灞曠幇鍑虹敱鍋忕闆嗕綋鎻忚堪鎵€椹卞姩鐨勪赴瀵屽姩鍔涘鐜拌薄銆傛湰宸ヤ綔灏嗚繖浜涙ā鍨嬬殑鐮旂┒鎷撳睍鑷冲紑鏀鹃噺瀛愮郴缁燂紝鑱氱劍浜庨潪灞€鍩熺浉浜掍綔鐢ㄤ笌灞€鍩熻€楁暎涔嬮棿澶嶆潅鐨勭浉浜掍綔鐢ㄣ€傜粨鏋滆〃鏄庯紝闀跨▼鐩镐簰浣滅敤瀵瑰紱璞殑褰卞搷鍏锋湁涓ら潰鎬э細瀹冧滑閫氳繃绋冲畾閾佺鐣淬€佸噺灏忓眬鍩熸定钀芥潵鎶戝埗鍣０鐨勫奖鍝嶏紝浣嗗悓鏃堕€氳繃闂存帴浣挎瘡涓嚜鏃嬫毚闇蹭簬鏇村箍闃旂殑鐜鑰屽姞閫熻蹇嗕抚澶便€傚己鑰楁暎灏嗙郴缁熼┍鍏ョ幓鐠冩€併€佸浣滅敤鑼冨洿涓嶆晱鎰熺殑寮涜鲍锛岃€屽急鑰楁暎鍖虹殑缁撴灉鍒欐彮绀哄嚭涓板瘜鐨勪緷璧栫姸鎬佺殑鍔ㄥ姏瀛︺€傚叿浣撹€岃█锛岄暱绋嬮泦浣撹涓轰繚鎶や簡浠庢瀬鍖栨€佹番鐏悗鐨勭郴缁熸棭鏈熺浉骞叉€э紝鍗翠富鍔ㄥ姞閫熶氦閿欎綅褰㈢殑寮涜鲍銆傛澶栵紝鍗充娇鍦ㄨ€楁暎娣伀鐨勮繎绋虫€侀樁娈碉紝闈炲眬鍩熺浉浜掍綔鐢ㄤ粛鎸佺画椹卞姩璁板繂閫€鍏宠仈銆傝繖浜涘彂鐜颁负浣跨敤闀跨▼鐩镐簰浣滅敤鐨勬ā鎷熼噺瀛愭ā鎷熷櫒鐨勮璁°€佹帶鍒跺拰鏍″噯鎻愪緵浜嗗強鏃剁殑鐞嗚娲炶銆?/p><details><summary>Abstract (English)</summary><div class="en-abs">Long-range interacting models exhibit rich dynamical phenomena driven by deviations from collective descriptions. This work extends the study of these models to open quantum systems, focusing on the complex interplay between nonlocal interactions and local dissipation. The results demonstrate that the impact of long-range interactions on relaxation is twofold: they mitigate the impact of noises by stabilizing ferromagnetic domains and reducing local fluctuation, yet simultaneously accelerate memory loss by indirectly exposing each spin to a broader environment. While strong dissipation drives the system into glassy, range-insensitive relaxation, the results in weak dissipation regime reveal rich state-dependent dynamics. Specifically, long-range collective behaviors protect the early-stage coherence of systems quenched from polarized states, whereas they actively accelerate the relaxation of staggered configurations. Furthermore, nonlocal interactions continue to drive memory decorrelation even in the near-steady stages of a dissipative quench. These findings offer timely theoretical insights for the design, control, and calibration of analog quantum simulators operating with long-range interactions.</div></details>
<p class="src"><span class="au">Zewen Zhang</span><br><span class="cite">Quantum Review Letters 2, 185-193 (2026)</span><br><a href="https://doi.org/10.1016/j.qrl.2026.08.002" target="_blank" rel="noopener">10.1016/j.qrl.2026.08.002</a></p>
</div>

<p class="teaser">鎻愬嚭楂樻€ц兘閲忓瓙缂栫▼妗嗘灦QPanda 3.0锛岄€氳繃浼樺寲缂栬瘧娴佹按绾裤€佽嚜瀹氫箟浜岃繘鍒舵寚浠ゆ祦涓庣‖浠舵劅鐭ユ墽琛岀瓥鐣ワ紝缂栫爜鍜岃В鐮佽緝OpenQASM 2.0鏈€楂樺垎鍒揩86.9鍊嶅拰35.6鍊嶏紝杈僎iskit骞冲潎缂栬瘧鍔犻€?0.7鍊嶃€?/p>
<p class="body">閲忓瓙璁＄畻鏈夋湜鍦ㄦ煇浜涢棶棰樼被鍒笂鐩歌緝缁忓吀鏂规硶瀹炵幇璁＄畻鍔犻€燂紱鐒惰€屽湪杩戞湡閲忓瓙涓庣粡鍏告贩鍚堝伐浣滄祦涓紝鏁翠綋鎬ц兘甯稿彈缁忓吀澶勭悊寮€閿€鍒剁害銆傜數璺紪璇戯紙鍖呮嫭闂ㄥ垎瑙ｃ€佹嫇鎵戞劅鐭ョ殑閲忓瓙姣旂壒鏄犲皠鍜屾繁搴︿紭鍖栵級浠ュ強鐢佃矾浼犺緭銆佹祴閲忕粨鏋滀氦鎹㈢瓑鍗忚灞傞€氫俊鎵€甯︽潵鐨勬椂闂存垚鏈紝甯稿父瓒呰繃瀹為檯閲忓瓙鐢佃矾鎵ц鏃堕棿锛屽凡鎴愪负瀹為檯閮ㄧ讲鐨勫叧閿摱棰堛€傛湰鏂囨彁鍑篞Panda 3.0锛屼竴涓珮鎬ц兘閲忓瓙缂栫▼妗嗘灦锛岄拡瀵规敮鎾慛ISQ鏃朵唬娣峰悎闆嗘垚鐨勭粡鍏哥紪璇戣矾寰勮繘琛屽姞閫熶紭鍖栥€傚€熷姪浼樺寲鐨勭紪璇戞祦姘寸嚎銆佽嚜瀹氫箟浜岃繘鍒舵寚浠ゆ祦锛圤riginBIS锛夊拰纭欢鎰熺煡鎵ц绛栫暐锛孮Panda 3.0鐩告瘮OpenQASM 2.0鐨勭紪鐮侀€熷害鏈€楂樻彁鍗?6.9鍊嶃€佽В鐮侀€熷害鏈€楂樻彁鍗?5.6鍊嶏紝骞跺湪鍥涚璇勪及鐨勮繛閫氭嫇鎵戜笂鐩歌緝Qiskit骞冲潎瀹炵幇10.7鍊嶇紪璇戝姞閫燂紝鍏朵腑鍦ㄦ柟褰㈡嫇鎵戜笂118閲忓瓙姣旂壒W鎬佺數璺殑鏈€楂樺姞閫熻揪597鍊嶃€傝繖浜涜兘鍔涗娇寰楀湪閲戣瀺銆佹潗鏂欑瀛﹀拰缁勫悎浼樺寲绛夊涓鍩熷紑鍙戝彲鎵╁睍閲忓瓙绠楁硶鎴愪负鍙兘锛屽苟鏀寔娣峰悎璁＄畻鐜涓殑宸ヤ笟閮ㄧ讲涓庝簯绔墽琛屻€?/p><details><summary>Abstract (English)</summary><div class="en-abs">Quantum computing promises computational speedups over classical approaches for certain problem classes; however, in near term quantum and classical hybrid workflows, the overall performance is often constrained by classical processing overhead. The time cost associated with circuit compilation, which includes gate decomposition, topology aware qubit mapping, and depth optimization, together with protocol level communication such as circuit transfer and measurement result exchange, frequently exceeds the actual quantum circuit execution time and has become a critical bottleneck to practical deployment. In this paper, we propose QPanda 3.0, a high performance quantum programming framework optimized to accelerate the classical compilation path that underpins NISQ era hybrid integration. Leveraging an optimized compilation pipeline, a custom binary instruction stream (OriginBIS), and hardware aware execution strategies, QPanda 3.0 achieves up to 86.9 脳 faster encoding and 35.6 脳 faster decoding than OpenQASM 2.0, as well as an average 10.7 脳 compilation speedup over Qiskit across the four evaluated connectivity topologies, with a peak speedup of 597 脳 for a 118-qubit W-state circuit on a square topology. These capabilities enable the development of scalable quantum algorithms across various domains, including finance, materials science, and combinatorial optimization, supporting both industrial deployment and cloud based execution in hybrid computing environments.</div></details>
<p class="src"><span class="au">Tian-Rui Zou, Yuan Fang, Jing Wang, Jun Fu, Shu-Bin Zhao, Lei Yu, Dong-Yi Zhao, Hui Wang, Chun-Yun Zhao, Yun Ma, Chuang-Shi Ma, Bin Ye, Ning Gao, Chun-Lin Wan, Meng-Han Dou, Zhao-Yun Chen, Guo-Ping Guo</span><br><span class="cite">Quantum Review Letters 2, 172-184 (2026)</span><br><a href="https://doi.org/10.1016/j.qrl.2026.08.001" target="_blank" rel="noopener">10.1016/j.qrl.2026.08.001</a></p>

ystems, and support the development of sustainable energy technologies.</div></details>

<p class="teaser">缁艰堪涓诲姩鍏夐挓杩戝崄骞翠粠姒傚康璧板悜瀹為獙鐨勮繘灞曪紝浠嬬粛鍧忚厰鏈哄埗涓嬫姂鍒惰厰鐗靛紩銆佺洿鎺ョ敱鍘熷瓙璺冭縼浜х敓鐩稿共閽熷厜鐨勫師鐞嗭紝浠ュ強鍐峰師瀛愯剦鍐茶秴杈愬皠涓庣儹鍘熷瓙杩炵画娉袱鏉℃妧鏈矾绾裤€?/p>
<p class="body">鍘熷瓙閽熸寜鍏惰繍琛屾柟寮忓彲澶ц嚧鍒嗕负琚姩鍨嬪拰涓诲姩鍨嬨€傚湪寰尝娉㈡锛屼富鍔ㄦ阿鑴夋辰鍏锋湁浼樺紓鐨勭煭鏈熺ǔ瀹氬害锛屼笌閾柗娉夋爣鍑嗕竴璧疯骞挎硾鐢ㄤ綔瀹堟椂绯荤粺涓殑椋炶疆鎸崱鍣ㄣ€傚湪鍏夊娉㈡锛岃鍔ㄥ厜閽熷凡瀹炵幇鍓嶆墍鏈湁鐨勫噯纭害鍜岀ǔ瀹氬害锛屼絾浠ｄ环鏄笌瓒呯ǔ鑵斾互鍙婂皢鍘熷瓙鍒跺鍦ㄥ厜鏅舵牸鎴栫瀛愰槺涓浉鍏崇殑澶у瀷澶嶆潅鍩虹璁炬柦銆傜浉姣斾箣涓嬶紝涓诲姩鍏夐挓鍦ㄥ潖鑵旀満鍒朵笅鐩存帴浠庡師瀛愯穬杩佷骇鐢熺浉骞查挓鍏夛紝鍏朵腑鑵旂壍寮曡寮虹儓鎶戝埗锛屼粠鑰岄檷浣庝簡瀵硅厰娉㈠姩鐨勬晱鎰熷害锛屽苟鏈夊彲鑳界畝鍖栧厜閽熸灦鏋勩€傝繃鍘诲崄骞撮棿锛屼富鍔ㄥ厜閽熷凡浠庢蹇垫€ф彁璁彂灞曟垚涓哄揩閫熸帹杩涚殑棰嗗煙锛屽寘鎷熀浜庡喎鍘熷瓙鐨勮剦鍐茶秴杈愬皠绯荤粺鍜屽熀浜庣儹鍘熷瓙钂告皵鐨勮繛缁尝鍧忚厰绯荤粺銆傛湰缁艰堪鎬荤粨涓诲姩鍏夐挓鐨勬渶鏂拌繘灞曪紝骞惰璁鸿棰嗗煙鐨勬湭鏉ユ柟鍚戙€?/p><details><summary>Abstract (English)</summary><div class="en-abs">Atomic clocks can be broadly classified into passive and active types according to their mode of operation. In the microwave domain, active hydrogen masers provide excellent short-term stability and are widely used as flywheel oscillators in timekeeping systems along with the cesium fountain standards. In the optical domain, passive optical clocks have achieved unprecedented accuracy and stability, but at the cost of large and complex infrastructures associated with ultrastable cavities and the preparation of atoms in optical lattices or ion traps. By contrast, active optical clocks generate coherent clock light directly from an atomic transition in the bad-cavity regime, where cavity pulling is strongly suppressed, thereby reducing sensitivity to cavity fluctuations and potentially simplifying optical clock architectures. Over the past decade, active optical clocks have developed from a conceptual proposal into a rapidly advancing field that includes pulsed superradiant systems based on cold atoms and continuous-wave bad-cavity systems based on thermal atomic vapors. This review summarizes recent progress in active optical clocks and discusses future directions of the field.</div></details>

<p class="teaser">鎻愬嚭浠ラ噺瀛愬害瑙勩€佹渶灏忚兘闅欏拰寰幆鏃堕棿鍒荤敾闈炵粷鐑穬杩佺殑鍑犱綍缁濈儹鍒ゆ嵁锛屽苟鍦ㄤ袱涓箍涔塖SH妯″瀷涓紭鍖栨车娴﹁矾寰勶紝浣垮崟鏍肩偣鎬佷笌鍙屾牸鐐圭籂缂犳€佺殑鎷撴墤閲忓瓙鎬佷紶杈撲繚鐪熷害鍜岄€熷害鏄捐憲鎻愬崌銆?/p>
<p class="body">鎷撴墤娉垫郸鍦ㄦ嫇鎵戠墿鐞嗕腑澶囧彈鍏虫敞锛屽湪瀹炵幇椴佹閲忓瓙鎬佷紶杈擄紙QST锛夋柟闈㈠叿鏈夊緢楂樹环鍊笺€傜劧鑰岋紝鍦ㄧ粷鐑紨鍖栬姹備笅鍔犻€熸嫇鎵慟ST浠嶅叿鎸戞垬銆傛湰宸ヤ綔鎻愬嚭涓€绉嶅嚑浣曠粷鐑垽鎹紝閲囩敤鏈夋晥閲忓瓙搴﹁锛岄€氳繃閲忓瓙搴﹁銆佹渶灏忚兘闅欏拰寰幆鏃堕棿鍒荤敾婕斿寲杩囩▼涓殑闈炵粷鐑穬杩併€傚埄鐢ㄤ袱涓箍涔塖u鈥揝chrieffer鈥揌eeger妯″瀷锛屾垜浠郴缁熼獙璇佷簡璇ョ粷鐑垽鎹湪鍒嗗埆浼樺寲鍗曟牸鐐规€佸拰鍙屾牸鐐圭籂缂犳€佹嫇鎵戞车娴﹁矾寰勬柟闈㈢殑鏈夋晥鎬с€傛暟鍊兼ā鎷熻〃鏄庯紝閫氳繃璁捐浣挎湁鏁堥噺瀛愬害瑙勬渶灏忓寲鐨勬车娴﹁矾寰勶紝QST鐨勪繚鐪熷害鍜岄€熷害鍙樉钁楁彁鍗囥€傛垜浠殑宸ヤ綔涓洪€氳繃閲忓瓙搴﹁浼樺寲瀹炵幇楂樹繚鐪熸嫇鎵慟ST鎻愪緵浜嗛€氱敤妗嗘灦銆?/p><details><summary>Abstract (English)</summary><div class="en-abs">Topological pumping has attracted great attention in topological physics and is highly valuable in the realization of robust quantum state transfer (QST). However, speeding up the topological QST under the requirement of adiabatic evolutions remains challenging. In this work, we propose a geometric adiabatic criterion with an effective quantum metric that characterizes non-adiabatic transitions during evolutions via the quantum metric, minimal energy gap and cycle time. Using two generalized Su鈥揝chrieffer鈥揌eeger models, we systematically validate our adiabatic criterion in optimizing topological pumping paths for transferring single-site states and two-site entangled states, respectively. With numerical simulations, we show that by designing pumping paths for minimizing the effective quantum metric, the fidelity and speed of the QST can be significantly improved. Our works provides a general framework for high-fidelity topological QST via quantum metric optimization.</div></details>

<p class="body">寰楃泭浜庤繎鏈熺殑蹇€熻繘灞曪紝鐢ㄤ簬妯℃嫙鎷撴墤鐩哥殑瓒呭喎鍘熷瓙鏅舵牸绯荤粺姝ｅ浜庡叧閿樁娈碉紝姝ｄ粠鏃㈡湁鑼冨紡婕斿彉涓烘棩鐩婇€氱敤鍜屽彲缂栫▼鐨勯噺瀛愭ā鎷熷櫒銆傚湪鏈患杩颁腑锛屾垜浠€冨療鍥涘ぇ绫诲钩鍙扮殑鏈€鏂板疄楠岃繘灞曪細鍏夋櫠鏍硷紝鍖呮嫭婵€鍏夎緟鍔╅毀绌垮厜鏅舵牸鍜屽厜瀛︽媺鏇兼櫠鏍硷紱鍔ㄩ噺绌洪棿鎴栧唴鎬佺┖闂翠腑鐨勫悎鎴愭櫠鏍硷紱Floquet宸ョ▼鏅舵牸锛涗互鍙婂厜闀婇樀鍒楋紝瀹冧滑閮戒负瀹炵幇鍜屾帰娴嬫嫇鎵戠墿璐ㄦ彁渚涗簡鐙壒鑳藉姏銆傚姣忎竴绫诲钩鍙帮紝鎴戜滑閲嶇偣浠嬬粛浠ｈ〃鎬у疄楠岀獊鐮淬€佸凡瀹炵幇鐨勬嫇鎵戞ā鍨嬩互鍙婃墍閲囩敤鐨勫厛杩涙帰娴嬩笌琛ㄥ緛鎶€鏈紝寮鸿皟杩欎簺浜掕ˉ鏂规硶濡備綍鍏卞悓鎷撳睍閲忓瓙妯℃嫙鐨勫墠娌裤€傛垜浠繕璁ㄨ寮哄叧鑱斾笌闈炲钩琛℃嫇鎵戠浉涓殑鏂板叴鏂瑰悜锛屽苟瀵规湭鏉ュ墠鏅綔鍑哄睍鏈涖€?/p><details><summary>Abstract (English)</summary><div class="en-abs">Owing to rapid recent progress, ultracold atomic lattice systems for simulating topological phases are now at a pivotal stage, evolving from established paradigms into increasingly versatile and programmable quantum simulators. In this review, we survey recent experimental advances across four major classes of platforms: optical lattices, including optical lattices with laser-assisted tunneling and optical Raman lattices; synthetic lattices in momentum or internal-state space; Floquet-engineered lattices; and optical tweezer arrays, all of which offer distinct capabilities for realizing and probing topological matter. For each class, we highlight representative experimental breakthroughs, the topological models that have been realized, and the advanced detection and characterization techniques employed, emphasizing how these complementary approaches collectively expand the frontier of quantum simulation. We also discuss emerging directions in strongly correlated and nonequilibrium topological phases, and conclude with an outlook on future prospects.</div></details>

<p class="body">鍙樺垎閲忓瓙绠楁硶锛圴QA锛夋槸鍚櫔涓瓑瑙勬ā閲忓瓙锛圢ISQ锛夊櫒浠跺疄闄呭簲鐢ㄧ殑涓昏鍊欓€夋柟妗堛€傝繎鏉ワ紝鍩轰簬鑴夊啿鐨勫彉鍒嗛噺瀛愮畻娉曪紙p-VQA锛変綔涓轰紶缁熷熀浜庨棬鐨刅QA鐨勬湁鍔涙浛浠ｆ柟妗堣€屽叴璧枫€傞€氳繃鐩存帴鍦ㄧ‖浠跺師鐢熷搱瀵嗛】閲忎笂浼樺寲杩炵画鎺у埗鍦猴紝鍩轰簬鑴夊啿鐨勬柟娉曟槗浜庡疄鐜帮紝骞惰兘鏄捐憲闄嶄綆閲忓瓙璧勬簮寮€閿€锛屼粠鑰屾彁鍗嘚ISQ鍣ㄤ欢涓婇噺瀛愮畻娉曠殑鏁翠綋鎬ц兘銆傚湪鏈患杩颁腑锛屾垜浠叏闈㈡⒊鐞唒-VQA鐨勬渶鏂拌繘灞曪紝娑电洊鐞嗚銆佺畻娉曚互鍙婂湪鍚勭被閲忓瓙璁＄畻骞冲彴涓婄殑纭欢閮ㄧ讲銆傛垜浠繕鍥為【p-VQA鍦ㄩ噺瀛愬寲瀛︿腑鐨勫彉鍒嗛噺瀛愭湰寰佹眰瑙ｅ櫒銆佺敤浜庣粍鍚堜紭鍖栫殑閲忓瓙杩戜技浼樺寲绠楁硶浠ュ強閲忓瓙鏈哄櫒瀛︿範浠诲姟涓殑搴旂敤銆?/p><details><summary>Abstract (English)</summary><div class="en-abs">Variational quantum algorithms (VQAs) are the leading candidates for practical applications of noisy intermediate-scale quantum (NISQ) devices. Recently, pulse-based variational quantum algorithms (p-VQAs) have emerged as a compelling alternative to traditional gate-based VQAs. By optimizing continuous control fields directly on hardware-native Hamiltonians, pulse-based methods are easy to implement and can significantly reduce quantum resource overhead, thereby enhancing the overall performance of quantum algorithms on NISQ devices. In this review, we present a comprehensive survey over recent advances in p-VQAs, covering theory, algorithms, and hardware deployments across various quantum computing platforms. We also review applications of p-VQAs to variational quantum eigensolver in quantum chemistry, quantum approximate optimization algorithm for combinatorial optimization, and quantum machine learning tasks.</div></details>

<p class="body">杩炵画鍙橀噺锛圕V锛夊缁勫垎绾犵紶鎬侊紝灏ゅ叾鏄疓reenberger鈥揌orne鈥揨eilinger锛圙HZ锛夋€侊紝鏄噺瀛愮綉缁滃拰閲忓瓙淇℃伅澶勭悊涓嶅彲鎴栫己鐨勮祫婧愩€傜敓鎴怌V GHZ鎬佺殑浼犵粺鏂规硶渚濊禆浜庨€氳繃澶嶆潅骞叉秹缃戠粶缁勫悎澶氫釜鐙珛鍒跺鐨勫帇缂╁厜锛岃繖鍦ㄥ彲鎵╁睍鎬у拰绋冲畾鎬ф柟闈㈠甫鏉ラ噸澶ф寫鎴樸€傚湪姝わ紝鎴戜滑瀹為獙婕旂ず浜嗕竴绉嶇揣鍑戜笖璧勬簮楂樻晥鐨勬柟妗堬紝鍒╃敤鍚屾娉垫郸鍏夊鍙傞噺鎸崱鍣ㄤ骇鐢熺殑鍗曚竴閲忓瓙棰戠巼姊崇敓鎴愪笁缁勫垎CV GHZ鎬併€傞€氳繃閲囩敤澶氬儚绱犻浂鎷嶆帰娴嬶紝鎴戜滑鍚屾椂娴嬮噺澶氫釜棰戝甫鐨勬浜ゆ定钀斤紝骞跺湪鍗曟娴嬮噺涓噸寤哄畬鏁寸殑澶氭ā鍗忔柟宸煩闃点€傞€氳繃鏈緛妯″垎瑙ｏ紝鎴戜滑鎻愬彇鍑轰竴缁勭嫭绔嬬殑鍘嬬缉瓒呮ā锛岄殢鍚庨€氳繃鍚庡鐞嗕腑瀹炵幇鐨勫畾鍒剁嚎鎬у购姝ｆ搷浣滃鍏惰繘琛屽彉鎹€傚埄鐢ㄨ鏂规硶锛屾垜浠粠涓変釜瓒呮ā纭畾鎬у湴鏋勫缓涓夌粍鍒咷HZ鎬侊紝骞堕€氳繃van Loock鈥揊urusawa鍒ゆ嵁楠岃瘉鍏剁籂缂狅紝娴嬪緱鐩稿簲鍏宠仈鏂瑰樊鍒嗗埆涓?.57銆?.75鍜?.57锛屽潎浣庝簬鏁ｇ矑鍣０鏋侀檺銆傝鏂规硶鍦ㄥ崟涓€鍏夋潫鍐呮湁鏁堝疄鐜颁簡鍙墿灞曠殑绾犵紶鐢熸垚鏂规锛屾棤闇€澶嶆潅骞叉秹缃戠粶銆傛垜浠殑缁撴灉涓哄妯￠噺瀛愪俊鎭鐞嗘彁渚涗簡鍙墿灞曚笖澶氬姛鑳界殑骞冲彴銆?/p><details><summary>Abstract (English)</summary><div class="en-abs">Continuous-variable (CV) multipartite entangled states, particularly Greenberger鈥揌orne鈥揨eilinger (GHZ) states, are an indispensable resource for quantum networks and quantum information processing. Conventional approaches to generating CV GHZ states rely on combining multiple independently prepared squeezed lights through complex interferometric networks, which impose significant challenges in scalability and stability. Here, we experimentally demonstrate a compact and resource-efficient scheme for generating a tripartite CV GHZ state from a single quantum frequency comb produced by a synchronously pumped optical parametric oscillator. By employing multipixel homodyne detection, we simultaneously measure quadrature fluctuations across multiple frequency bands and reconstruct the full multimode covariance matrix in a single measurement. Through eigenmode decomposition, we extract a set of independent squeezed supermodes, which are subsequently transformed via a tailored linear unitary operation implemented in post-processing. Using this approach, we deterministically construct a tripartite GHZ state from three supermodes and verify its entanglement via the van Loock鈥揊urusawa criteria, with the corresponding correlation variances measured to be 0.57, 0.75, and 0.57, all below the shot noise limit. This method effectively realizes a scalable entanglement generation scheme within a single optical beam, eliminating the need for complex interferometric networks. Our results provide a scalable and versatile platform for multimode quantum information processing.</div></details>

<p class="body">瓒呮潗鏂欏嚟鍊熶汉宸ヨ璁＄殑浜氭尝闀跨粨鏋勶紝灞曠幇鍑哄ぉ鐒舵潗鏂欐墍涓嶅叿澶囩殑闈炲嚒鍏夊涓庨潪绾挎€у厜瀛︽€ц川锛屼緥濡傝礋鎶樺皠鐜囧拰澧炲己鐨勯潪绾挎€ф晥搴斻€傝繖浜涙€ц川婧愪簬鍏舵嫇鎵戯紙鍑犱綍锛夎璁★紙鍗崇┖闂存帓甯冧笌杩為€氭€э級锛岃€岄潪鍖栧缁勬垚銆傚敖绠″凡鍙栧緱鏄捐憲杩涘睍锛屽皢杩欑被娑岀幇鐜拌薄涓庡噯缁村害鎷撴墤璁捐鑱旂郴璧锋潵鐨勫畬鏁寸悊璁烘鏋朵粛鏈鎺㈢储銆傚湪鏈伐浣滀腑锛屾垜浠彁鍑轰竴涓畝鍗曞嵈寮哄ぇ鐨勫井瑙傜悊璁烘ā鍨嬶紝鍩轰簬閽堝鍒嗗舰绛夊噯缁村害娴佸舰鐨勫畾鎬佽枦瀹氳皵鏂圭▼锛岃绠楀崟涓秴鍘熷瓙鐨勫垎瀛愭瀬鍖栫巼銆傞殢鍚庨€氳繃Lorentz鈥揕orenz鍏崇郴鑾峰緱瀹忚鎶樺皠鐜囷紝骞跺€熷姪缁熻鍔涘鏋惰捣寰涓庡畯瑙傛弿杩颁箣闂寸殑妗ユ銆傞€氳繃鎺ㄥ箍鎷夋櫘鎷夋柉绠楃骞跺紩鍏ュ垎鏁伴樁瀵兼暟锛屾垜浠鍑轰簡閫傜敤浜庨潪鏁存暟缁村害绯荤粺鐨勫舰寮忎綋绯汇€傛垜浠€氳繃鍒嗘瀽绾︽潫鍦ㄦ澶氳竟褰㈠拰Koch闆姳鏇茬嚎涓婄殑绮掑瓙鐨勬尝鍑芥暟涓庨潤鎬佸伓鏋佹瀬鍖栫巼鏉ラ獙璇佽妯″瀷锛屽睍绀轰簡鍚戠粡鍏告瀬闄愮殑鏀舵暃浠ュ強涓庤礋鎶樺皠鐜囧疄楠岃娴嬬殑瀹氭€т竴鑷淬€傛洿鍏蜂綋鍦拌锛岃妯″瀷棰勬祴鐢垫瀬鍖栫巼闅忓垎褰㈠鏉傚害澧炲姞鑰屽彂鏁ｏ紝骞堕€氳繃Lorentz鈥揕orenz鍏崇郴鍦ㄦ笎杩戞瀬闄愪笅瀵艰嚧绾櫄鎶樺皠鐜囷紙瀹岀編鍙嶅皠浣擄級鈥斺€旇繖涓€瓒嬪娍涓庝粎鍑嚑浣曠粨鏋勫嵆鍙骇鐢熼潪鏍囧噯鍏夊鍝嶅簲鐨勮瀵熷畾鎬т竴鑷淬€傛垜浠殑缁撴灉鍑告樉浜嗘嫇鎵戝湪鍐冲畾鍏夊鎬ц川涓殑鍏抽敭浣滅敤锛屽苟涓鸿璁″叿鏈夊畾鍒跺姛鑳界殑鍏堣繘瓒呮潗鏂欏瀹氫簡鍩虹锛屽彲搴旂敤浜庣敓鐗╂潗鏂欍€佸厜瀛愬銆佷紶鎰熷拰閫氫俊绛夐鍩熴€?/p><details><summary>Abstract (English)</summary><div class="en-abs">Meta-materials, with their artificially engineered subwavelength structures, exhibit extraordinary optical and nonlinear optical properties not found in natural materials, such as negative refractive index and enhanced nonlinear effects. These properties arise from their topological (geometric) design ( i.e. , spatial arrangement and connectivity) rather than chemical composition. Despite significant advancements, a comprehensive theoretical framework linking these emergent phenomena to quasi-dimensional topological design remains unexplored. In this work, we propose a simple yet powerful microscopic theoretical model based on the Time-Independent Schr枚dinger Equation for quasi-dimensional manifolds, such as fractals, to compute the molecular polarizability of individual meta-atoms. The macroscopic refractive index is then obtained via the Lorentz鈥揕orenz relation, bridging the microscopic and macroscopic descriptions through statistical mechanics. By generalizing the Laplacian operator and introducing fractional derivatives, we derive a formalism applicable to systems with non-integer dimensions. We validate our model by analyzing the wavefunctions and static dipole polarizabilities of particles constrained on regular polygons and Koch snowflake curves, demonstrating convergence to classical limits and qualitative agreement with experimental observations of negative refractive index. More specifically, the proposed model predicts a divergent electric polarizability as fractal complexity increases, leading via the Lorentz鈥揕orenz relation to a purely imaginary refractive index (perfect reflector) in the asymptotic limit 鈥?a qualitative trend consistent with the observation that geometric structure alone can produce non-standard optical responses. Our results highlight the pivotal role of topology in determining optical properties and provide a foundation for designing advanced meta-materials with tailored functionalities for applications in biomaterials, photonics, sensing, and telecommunications.</div></details>

<p class="teaser">缁艰堪鍐峰師瀛愬悎鎴愮淮搴﹀钩鍙扮殑鍩烘湰鍘熺悊涓庤繎鏈熻繘灞曪紝璇存槑濡備綍鎶婂唴閮ㄦ垨澶栭儴鍘熷瓙鎬佹槧灏勪负绂绘暎鏍肩偣浠ュ疄鐜扮揣鏉熺細鍝堝瘑椤块噺鐨勭伒娲昏璁★紝骞惰璁哄叾浼樺娍銆佸眬闄愪笌鏈潵鏂瑰悜銆?/p>
<p class="body">鍚堟垚缁村害鏂规硶宸叉垚涓哄喎鍘熷瓙閲忓瓙妯℃嫙宸ュ叿绠变腑涓€绉嶉€氱敤鑰屽己澶х殑鎶€鏈紝鏄紶缁熷厜鏅舵牸骞冲彴鐨勬湁鍔涜ˉ鍏呫€傞€氳繃灏嗗師瀛愮殑鍐呴儴鎴栧閮ㄦ€佹槧灏勪负绂绘暎鏍肩偣锛岃鏂规硶鍙簿纭帶鍒跺眬鍩熼毀绌垮箙搴︺€佺浉浣嶅拰鏍肩偣鍔匡紝浠庤€岀伒娲昏璁＄揣鏉熺細鍝堝瘑椤块噺銆傚€熷姪杩欎簺鑳藉姏锛屼汉浠湪瓒呯簿缁嗘€佷笌閲屽痉鍫℃€併€佸姩閲忔櫠鏍间互鍙婅皭鎸瓙闃辨ā寮忕瓑涓€绯诲垪骞冲彴涓婏紝瀹為獙鎺㈢储浜嗘嫇鎵戙€佸悎鎴愯鑼冨満銆佹棤搴忚瀵肩幇璞′互鍙婂鐗圭殑鏃堕棿渚濊禆鍔ㄥ姏瀛︺€傛湰缁艰堪鎬荤粨浜嗕富瑕佸疄楠屽悎鎴愮淮搴﹀钩鍙扮殑鍩烘湰鍘熺悊鍙婂叾鍦ㄩ噺瀛愭ā鎷熸柟闈㈢殑鏈€鏂拌繘灞曘€傛垜浠繕璁ㄨ浜嗗悎鎴愮淮搴︽柟娉曠殑浼樺娍涓庡綋鍓嶅眬闄愶紝骞跺鏈潵鏂瑰悜浣滃嚭灞曟湜锛屽寘鎷贩鍚堢淮搴︽灦鏋勫拰楂樼淮澶氫綋鐗╃悊鐮旂┒銆?/p><details><summary>Abstract (English)</summary><div class="en-abs">Synthetic dimension approach has emerged as a versatile and powerful technique in cold-atom toolbox for quantum simulation, serving as a complementary alternative to conventional optical lattice platforms. By mapping internal or external atomic states into discrete lattice sites, this method provides precise control over local tunneling amplitudes, phases, and on-site potentials, enabling flexible engineering of tight-binding Hamiltonians. Such capabilities have facilitated the experimental exploration of topology, synthetic gauge fields, disorder-induced phenomena, and exotic time-dependent dynamics across a range of platforms, including hyperfine and Rydberg states, momentum lattices, and harmonic-trap modes. In this review, we summarize the underlying principles of the key experimental synthetic dimension platforms, and their recent advances in quantum simulation. We also discuss the advantages and current limitations of the synthetic method, and provide a perspective on future directions, including hybrid-dimensional architectures and the study of high-dimensional many-body physics.</div></details>

<p class="body">鏈€杩戯紝浜轰滑閽堝鐢变换鎰忛潪瀹氬父鍝堝瘑椤块噺鏀厤鐨勯噺瀛愮郴缁熷购姝ｆ椂闂存紨鍖栵紝鎻愬嚭浜嗛噺瀛愬姞閫熷害鏋侀檺鐨勬蹇点€傝鏋侀檺琛ㄦ槑锛屽搱瀵嗛】閲忕畻绗︾殑鏍囧噯宸殢鏃堕棿鐨勫彉鍖栫巼鈥斺€斿畠琛ㄥ緛閲忓瓙婕斿寲鍦ㄦ姇褰卞笇灏斾集鐗圭┖闂翠腑鐨勫姞閫熷害鈥斺€斿彈鍒板搱瀵嗛】閲忔椂闂村鏁扮殑鏍囧噯宸殑绾︽潫锛屽嵆 蟽虈_H 鈮?蟽_岣€傛湰鏂囧皢鎴戜滑鏃╁厛鐨勫彂鐜版帹骞垮埌骞烘閲忓瓙鍔ㄥ姏瀛︽鏋朵笅鐨勪换鎰忓彲瑙傛祴閲?A锛屽緱鍒颁笉绛夊紡 蟽虈_A 鈮?蟽_vA銆傝繖涓€鍏崇郴鎰忓懗鐫€锛屼换鎰忓彲瑙傛祴閲忕殑鏍囧噯宸殑鍙樺寲閫熷害鍙楀叾鐩稿簲鐨勯€熷害鍨嬪彲瑙傛祴閲?v_A 鐨勬爣鍑嗗樊闄愬埗銆傛渶鍚庯紝鍑轰簬鏁欏鐩殑锛屾垜浠粰鍑烘竻鏅扮殑渚嬪瓙鏉ヨ鏄庤涓嶇瓑寮忕殑鎰忎箟锛岄€夊彇浜嗕笌浜岃兘绾ч噺瀛愮郴缁熺殑骞烘鍔ㄥ姏瀛︿互鍙婃湁闄愮淮绂忓厠绌洪棿涓皭鎸瓙鐩稿叧鐨勫悎閫傚彲瑙傛祴閲忋€?/p><details><summary>Abstract (English)</summary><div class="en-abs">Recently, the notion of a quantum acceleration limit has been proposed for any unitary time evolution of quantum systems governed by arbitrary nonstationary Hamiltonians. This limit articulates that the rate of change over time of the standard deviation of the Hamiltonian operator 鈥?representing the acceleration of quantum evolution within projective Hilbert space 鈥?is constrained by the standard deviation of the time-derivative of the Hamiltonian, expressed as 蟽 虈 H 鈮?蟽 H 虈 . In this paper, we extend our earlier findings to encompass any observable A within the framework of unitary quantum dynamics, leading to the inequality 蟽 虈 A 鈮?蟽 v A . This relationship signifies that the speed of the standard deviation of any observable is limited by the standard deviation of its associated velocity-like observable v A . Finally, for pedagogical purposes, we illustrate the relevance of our inequality by providing clear examples. We choose suitable observables related to the unitary dynamics of two-level quantum systems, as well as a harmonic oscillator within a finite-dimensional Fock space.</div></details>

<p class="body">涓嶇‘瀹氬害鏄師瀛愰挓鏈€閲嶈鐨勭壒鎬т箣涓€锛屽畠閫氳繃涓€绯诲垪閽堝鐩稿叧鐗╃悊鏁堝簲鐨勪笓闂ㄥ疄楠岃瘎浼拌幏寰椼€傛湰鏂囨彁鍑轰竴绉嶈瘎浼板師瀛愰挓鏌愪簺鐗╃悊鏁堝簲涓嶇‘瀹氬害璐＄尞鐨勬敼杩涙柟娉曘€備笌浠ュ線鏂规硶鐩告瘮锛岃鏂规硶鐫€鐪间簬鍘熷瓙閽熻繍琛岃繃绋嬩腑璁板綍鐨勫師瀛愰挓棰戠巼淇″彿涓庣幆澧冨櫔澹颁俊鍙蜂箣闂寸殑鍏宠仈锛屾棤闇€寮€灞曚笓闂ㄥ疄楠屻€傜悊璁哄垎鏋愪笌鏁板€兼ā鎷熻〃鏄庯紝璇ユ柟娉曡兘澶熸祴閲忕伒鏁忓害绯绘暟骞惰瘎浼扮浉鍏充笉纭畾搴︺€傚湪 87Rb 鍠锋硥棰戠巼鏍囧噯涓婅繘琛屼簡瀹為獙楠岃瘉锛岃瘎浼颁簡浜岄樁濉炴浖棰戠Щ鍜岀鎾為绉伙紝缁撴灉鍒嗗埆涓?1.418(47)脳10鈦宦孤?鍜?1.44(9)脳10鈦宦光伓銆傛祴寰楃殑浜岄樁濉炴浖棰戠Щ涓庝互寰€鏂规硶鐨勭粨鏋滃湪 0.3% 鐨勫亸宸唴涓€鑷淬€傝鏂规硶鍙湪姝ｅ父杩愯鏈熼棿瀹炴椂銆佸悓鏃惰瘎浼板涓富瑕佺郴缁熸晥搴斿甫鏉ョ殑涓嶇‘瀹氬害锛屽洜鑰屽湪鍘熷瓙閽熶笌绮惧瘑娴嬮噺棰嗗煙鍏锋湁閲嶈搴旂敤浠峰€笺€?/p><details><summary>Abstract (English)</summary><div class="en-abs">Uncertainty is one of the most important characteristics of atomic clocks, which is obtained through a series of specific experiment evaluation of relevant physical effects. This paper presents an improved method for evaluating uncertainty contribution of some physical effects of atomic clock. Compared with previous method, the method focuses on the correlation of frequency signal of atomic clock and environmental noise signal which is recorded in the operation of atomic clock, and specific experiment is not necessary.Theoretical analysis and numerical simulations demonstrate that this method enables the measurement of sensitivity coefficients and the evaluation of associated uncertainties. Experimental demonstration was conducted on an 87 Rb fountain frequency standard, where the second-order Zeeman frequency shift and collision frequency shift were evaluated, with the result of 1 . 418 ( 47 ) 脳 1 0 鈭?13 and 1 . 44 ( 9 ) 脳 1 0 鈭?16 , respectively. The measured second-order Zeeman shift is consistent with results from previous methods within a deviation of 0.3%. The method allows real-time, concurrent uncertainty evaluation of multiple dominant systematic effects during normal operation, thereby holding significant application value in atomic clocks and precision measurement.</div></details>

<p class="teaser">閲囩敤闈炲潎鍖€澶ф皵浼犺緭妯″瀷鍒荤敾婀嶆祦銆佹皵婧惰兌鏁ｅ皠銆佸お闃冲共鎵颁笌骞冲彴鎶栧姩绛夋崯鑰楋紝鏁板€兼ā鎷熶笉鍚屽ぉ椤惰涓庣幆澧冩潯浠朵笅妯″紡閰嶅 QKD 鐨勬垚鐮佺巼锛屾寚鍑哄ぉ椤惰澧炲ぇ浼氭樉钁楅檷浣庢垚鐮佺巼锛屽闂存槑鏄句紭浜庣櫧澶┿€?/p>
<p class="body">鏈爺绌惰€冨療妯″紡閰嶅閲忓瓙瀵嗛挜鍒嗗彂锛圡P-QKD锛夊湪鏄熷湴鑷敱绌洪棿淇￠亾涓婄殑鎬ц兘銆傞噰鐢ㄩ潪鍧囧寑澶ф皵浼犺緭妯″瀷鏉ュ埢鐢诲瘑閽ユ崯鑰楁満鍒讹紝鍖呮嫭婀嶆祦銆佹皵婧惰兌鏁ｅ皠銆佸お闃冲共鎵颁互鍙婂钩鍙板紩璧风殑鍏夋潫鎶栧姩銆傛暟鍊兼ā鎷熼噺鍖栦簡涓嶅悓澶╅《瑙掑拰鐜鏉′欢涓嬬殑瀹夊叏瀵嗛挜鐜囥€傜粨鏋滆〃鏄庯紝澶╅《瑙掑澶т細鏄捐憲闄嶄綆瀵嗛挜鐜囷紝鍥犱负鏇撮暱鐨勫厜绋嬪姞鍓т簡浼犺緭鎹熻€楀拰澶ф皵鎹熶激銆傚湪鐩稿悓澶ф皵鏉′欢涓嬶紝澶滈棿鐨勫瘑閽ョ巼楂樹簬鐧藉ぉ锛屼富瑕佸師鍥犳槸澶槼骞叉壈鍙拷鐣ワ紝瀵艰嚧鑳屾櫙鍏夊瓙璁℃暟鏇翠綆銆侀噺瀛愭瘮鐗硅鐮佺巼锛圦BER锛夋洿灏忋€傚湪褰撳墠鐨勭畝鍖栨ā鍨嬩腑锛屽澶ф渶澶ч厤瀵归棿闅?l 鍙彁楂樺瘑閽ョ巼锛屼絾澧炵泭閫愭笎楗卞拰銆傝繖浜涚粨鏋滅粰鍑轰簡 MP-QKD 鍦ㄤ唬琛ㄦ€ф槦鍦拌嚜鐢辩┖闂存瀯鍨嬩笅鐨勬€ц兘璇勪及锛屽苟涓哄弬鏁伴€夋嫨銆佺幆澧冩晱鎰熸€у垎鏋愬拰椴佹绯荤粺璁捐鎻愪緵浜嗗疄鐢ㄦ寚瀵笺€?/p><details><summary>Abstract (English)</summary><div class="en-abs">This study investigates the performance of mode-pairing quantum key distribution (MP-QKD) over satellite-to-ground free-space channels. A nonuniform atmospheric transmission model is adopted to characterize key loss mechanisms, including turbulence, aerosol scattering, solar interference, and platform-induced beam jitter. Numerical simulations quantify the secret key rate under varying zenith angles and environmental conditions. Results show that increasing zenith angle significantly degrades the key rate because the longer optical path aggravates propagation loss and atmospheric impairment. Under identical atmospheric conditions, nighttime achieves a higher key rate than daytime, mainly because negligible solar interference leads to lower background-photon counts and a reduced QBER. Within the present simplified model, increasing the maximum pairing interval l improves the key rate, although the gain gradually saturates. These findings provide a performance evaluation of MP-QKD in a representative satellite-to-ground free-space configuration and offer practical guidance for parameter selection, environmental-sensitivity analysis, and robust system design.</div></details>

<p class="body">鎴戜滑鎻愬嚭涓€绉嶅埗澶囨満姊拌繍鍔ㄧ被鐚彔鍔犳€佺殑鍏夌鍔涙柟妗堛€傝鏂规鍖呭惈涓や釜姝ラ锛屽熀浜庣鍔涚郴缁燂紝鍏朵腑纾佽嚧浼哥缉璇卞鐨勪綅绉昏繘涓€姝ラ€氳繃杈愬皠鍘嬩笌鍏夊鑵旀ā鑰﹀悎銆傛垜浠鍏堢敤涓ゆ潫寰尝鑴夊啿椹卞姩纾佸姏绯荤粺锛屽埗澶囦竴涓帇缂╂満姊版€併€傞殢鍚庡叧闂井娉㈤┍鍔紝骞跺悜鍏夊鑵旇緭鍏ヤ竴鏉熷急鐨勭孩澶辫皭鍏夎剦鍐诧紝浠ュ井寮辨縺鍙戝厜鍔涘弽鏂墭鍏嬫柉鏁ｅ皠銆傛垜浠〃鏄庯紝鍦ㄤ互鎺㈡祴鍒版潵鑷厰杈撳嚭鍦虹殑 k 涓弽鏂墭鍏嬫柉鍏夊瓙涓烘潯浠舵椂锛屽彲浠ヤ粠鎵€鍒跺鐨勫帇缂╃儹鎬佷腑鍑忓幓 k 涓０瀛愶紝浠庤€屼娇鏈烘杩愬姩澶勪簬绫荤尗鎬併€傝宸ヤ綔涓虹粨鍚堝厜鍔涘涓庣鍔涘鐢熸垚鏈烘鍙犲姞鎬佹彁渚涗簡鏂伴€斿緞锛屽苟鍙兘鍦ㄥ畯瑙傞噺瀛愭€佺爺绌跺拰鍧嶇缉鐞嗚妫€楠屼腑鎵惧埌搴旂敤銆?/p><details><summary>Abstract (English)</summary><div class="en-abs">We propose an optomagnomechanical approach for preparing a cat-like superposition state of mechanical motion. Our protocol consists of two steps and is based on the magnomechanical system where the magnetostrictively induced displacement further couples to an optical cavity mode via radiation pressure. We first prepare a squeezed mechanical state by driving the magnomechanical system with two microwave pulses. We then switch off the microwave drives and send a weak red-detuned optical pulse to the optical cavity to weakly activate the optomechanical anti-Stokes scattering. We show that k phonons can be subtracted from the prepared squeezed thermal state, conditioned on the detection of k anti-Stokes photons from the cavity output field, which prepares the mechanical motion in a cat-like state. The work provides a new avenue for preparing mechanical superposition states by combining opto- and magnomechanics and may find applications in the study of macroscopic quantum states and the test of collapse theories.</div></details>

f practical quantum chips for application of quantum communication, sensing and metrology in the future. 鈥?Strong mode confinement and domain-engineered thin film lithium niobate (TFLN), combined with large 蠂 ( 2 ) , enable efficient on-chip nonlinear conversion. 鈥?First demonstration of quantum frequency conversion (QFC) of 2 渭 m band photon on thin film lithium niobate.</div></details>

<p class="body">閲忓瓙淇℃伅绉戝涓庢妧鏈殑鏈€鏂板彂灞曪紝灏ゅ叾鏄彲缂栫▼閲忓瓙璁＄畻鏈虹殑鏋勫缓锛屼负鐮旂┒閲忓瓙鍔涘鐨勫熀鏈棶棰樻彁渚涗簡鏂版満閬囥€傛垜浠彁鍑洪噺瀛愭瘮鐗规ā鍨嬫潵妯℃嫙閲忓瓙娴嬮噺杩囩▼锛屽叾涓竴涓噺瀛愭瘮鐗圭殑閲忓瓙淇℃伅琚槧灏勫埌涓€缁勫厖褰撴祴閲忚缃殑閲忓瓙姣旂壒涓娿€備竴涓ā鍨嬪彈鍗曞厜瀛愭帰娴嬪惎鍙戯紝鍙︿竴涓彈鑷棆娴嬮噺鍚彂銆備袱涓ā鍨嬮兘鍙墿灞曚互鐢熸垚钖涘畾璋旂尗鎬侊紝骞剁粰鍑轰簡鐩稿簲鐨勬樉寮忛噺瀛愮嚎璺€傚ぇ瑙勬ā妯℃嫙鍙湪杩戞湡閲忓瓙璁＄畻鏈轰笂瀹炵幇锛岃€岀粡鍏歌绠楁満鏃犳硶楂樻晥瀹屾垚鍚屾牱鐨勪换鍔°€傜敱浜庢ā鍨嬬殑鍙墿灞曟€э紝姝ょ被妯℃嫙鏈夊姪浜庢帰绱㈤噺瀛愭祴閲忛棶棰樹腑鍙兘瀛樺湪鐨勯噺瀛?缁忓吀杈圭晫銆傛澶栵紝鎴戜滑鐢熸垚鐚€佺殑鍗忚鍙兘鍦ㄩ噺瀛愯绠椾笌閲忓瓙璁￠噺涓叿鏈夐噸瑕佸簲鐢ㄣ€?/p><details><summary>Abstract (English)</summary><div class="en-abs">Recent development in quantum information sciences and technologies, especially building programmable quantum computers, provide us new opportunities to study fundamental aspects of quantum mechanics. We propose qubit models to emulate the quantum measurement process, in which the quantum information of a qubit is mapped to a collection of qubits acting as the measurement device. One model is motivated by single-photon detection and the other by spin measurement. Both models are scalable to generate Schr枚dinger cat-like state, and their corresponding quantum circuits are shown explicitly. Large-scale simulations could be realised in near-term quantum computers, while classical computers cannot perform the same task efficiently. Due to the scalability of the models, such simulations can help explore the quantum-to-classical boundary, if exists, in the quantum measurement problem. Besides, our protocol to generate cat states may have important applications in quantum computing and metrology.</div></details>

s the use of averaged QFI matrices over random parameter samples, which exposes robust global trends and reveals strongly non-uniform parameter relevance across architectures and depths. Leveraging these insights, we propose a QFI-Informed Mutation (QIm) heuristic that adapts mutation probabilities and step sizes using diagonal QFI entries. QIm improves convergence and stability over uniform and random-restart baselines, especially at large depths and in RIM landscapes. In general, our results position QFI as both a structural probe of QAOA ans盲tze and a practical resource to guide the design of effective optimization strategies in the NISQ regime.</div></details>

<p class="body">鏈爺绌剁郴缁熻€冨療浜嗗湪寰幆鑵斾腑寮曞叆鑷敱杞芥祦瀛愯€楀敖瀵瑰叧鑱斿厜瀛愬浜х敓鐨勫奖鍝嶃€傝嚜鐢辫浇娴佸瓙鑰楀敖閫氳繃鍦ㄧ寰幆璋愭尟鍣ㄦ梺宓屽叆 p-i-n 浜屾瀬绠″苟鏂藉姞鍙嶅悜鍋忓帇瀹炵幇锛屼粠鑰岄檷浣庤嚜鐢辫浇娴佸瓙鍚告敹閫犳垚鐨勯潪绾挎€ф崯鑰椼€傚疄楠岀粨鏋滆〃鏄庤嚜鐢辫浇娴佸瓙瀵垮懡鏄捐憲缂╃煭锛屾敼鍠勪簡鍏夊瓙瀵逛骇鐢熺殑鍏抽敭鎸囨爣锛屽寘鎷鍚堣鏁扮巼銆佺鍚堜笌鍋剁劧绗﹀悎姣旓紙CAR锛変互鍙婇鍛婃晥鐜囥€傚湪 0.038 mW 鑵斿唴鍔熺巼鍜?30 V 鍋忓帇涓嬶紝瀹炵幇浜嗘帴杩?5 GHz/mW虏 鐨勯珮鍏夊瓙瀵逛骇鐢熺巼锛岀浉搴旂殑 CAR 涓?231銆傜劧鑰屼篃瑙傚療鍒帮紝楂樻车娴﹀姛鐜囧甫鏉ョ殑绾挎€у櫔澹板拰鐑壈鍔ㄧ瓑鍓綔鐢ㄥ彲鑳藉帇鍊掕繖浜涙敼鍠勩€傝繃楂樼殑鐢靛帇鍚屾牱浼氫娇鎬ц兘涓嬮檷锛屽洜涓烘秷鍏夋瘮鍋忕鏈€浣冲伐浣滅偣銆傛澶栵紝杩樿€冭檻浜嗙洿娴佷緵鐢典腑瀛樺湪鐨勭數婧愮嚎骞叉壈锛屽畠浼氬湪閫忓皠璋变腑寮曡捣鏄捐憲鎸崱锛屽苟琚瘉鏄庝笉鍒╀簬鍏夊瓙瀵圭殑浜х敓銆?/p><details><summary>Abstract (English)</summary><div class="en-abs">This study systematically investigates the impact of introducing free-carrier depletion to the microring cavity on the correlated photon-pair generation. The free-carrier depletion is realized through embedding a p-i-n diode adjacent to the silicon microring resonator and applying a reverse bias voltage, thus reducing the nonlinear loss caused by free carrier absorption. Experimental results show a significant reduction in free-carrier lifetime, which improves key metrics of photon-pair generation, including coincidence rate, coincidence-to-accidental ratio (CAR), and heralding efficiency. A high pair generation rate of near 5 GHz/mW 2 with an associated CAR of 231 is achieved at 0.038 mW on-cavity power and 30 V bias. However, it is observed that the side-effect such as linear noise and thermal disturbance due to high pump power can override the improvements. Excessively high voltage can also degrade the performance as the extinction ratio is deviated from the optimum operating point. Additionally, the power-line interference existing in the DC supply is considered, which induces significant oscillation in the transmission spectrum and is shown detrimental to the photon-pair generation.</div></details>

<p class="teaser">鎻愬嚭涓€绉嶅熀浜庣嚎鎬х綉缁滅紪鐮佺殑閲忓瓙澶氭挱鏂规锛屽€熷姪鍙戦€佹柟涓庢帴鏀舵柟涔嬮棿鐨凣HZ鎬佸拰闈炲绉版渶浼樻櫘閫傚厠闅嗭紝浣垮悇鎺ユ敹鏂硅兘鑷富璋冭妭鎭㈠鎬佺殑淇濈湡搴︼紝浠呴渶1娆￠噺瀛愪紶杈撳拰2娆＄粡鍏镐紶杈撳嵆鍙畬鎴愬鎾€?/p>
<p class="body">鏈煡閲忓瓙鎬佺殑澶氭挱鏄噺瀛愮綉缁滄瀯寤轰腑涓嶅彲鍥為伩鐨勯棶棰樸€傜幇鏈夊ぇ澶氭暟閲忓瓙缃戠粶缂栫爜鏂规鍦ㄥ鎾椂鍙兘鍦ㄤ竴涓洰鏍囪妭鐐逛笂鎭㈠鏈煡鎬併€傛湰鏂囨彁鍑轰竴绉嶅湪绾挎€х綉缁滅紪鐮佺綉缁滀腑澶氭挱鏈煡閲忓瓙鎬佺殑鏂规銆傚叿浣撹€岃█锛屾瘡涓彂閫佹柟涓庢墍鏈夋帴鏀舵柟涔嬮棿鍏堝埗澶嘒HZ鎬侊紝闅忓悗鏈煡鎬佽鍙戦€佸苟瀛樺偍浜庢帴鏀舵柟鍏变韩鐨勭籂缂犳€佷箣涓紝鏈€鍚庢帴鏀舵柟鍒╃敤闈炲绉版渶浼樻櫘閫傚厠闅嗚幏寰楁墍闇€鐨勬€併€傝鏂规鍦ㄧ粡鍏搁€氫俊鍙楅檺鐨勭綉缁滀腑鍙渶1娆￠噺瀛愪紶杈撳拰2娆＄粡鍏镐紶杈撳嵆鍙疄鐜板鎾€備笌鍏朵粬鏂规鐩告瘮锛屾湰鏂规鍏佽鎺ユ敹鏂硅嚜涓昏皟鑺備繚鐪熷害锛岃€屽彂閫佹柟鏃犻』鐭ユ檽鍏堕渶姹傘€?/p><details><summary>Abstract (English)</summary><div class="en-abs">Multicast of unknown quantum states is an unavoidable issue in the construction of quantum networks. Most existing quantum network coding schemes can only restore an unknown state at one of the target nodes during multicast. In this paper, we propose a quantum network coding scheme to multicast unknown quantum states in networks with linear network coding. Concretely, GHZ states are generated between each sender and all receivers. Unknown states are then sent and stored in the entangled state shared by the receivers. Finally, the receivers use asymmetric optimal universal cloning to obtain the required states. The scheme achieved to multicast within 1 quantum transmission and 2 classical transmissions in networks with constrained classical communication. Compared to other schemes, our scheme allows receivers to autonomously adjust the fidelity without the sender knowing the requirements.</div></details>

<p class="teaser">缁艰堪浠ュ師瀛愮寮鸿涓轰紶鎰熷櫒鐨勭數纾佹劅搴旀垚鍍忔妧鏈細鍘熷瓙纾佸己璁″湪浣庨涓嬩粛淇濇寔鏋侀珮鐏垫晱搴︼紝绐佺牬浜嗕紶缁熺嚎鍦堢殑闄愬埗锛屼娇绌块殰鎴愬儚涓庝汉浣撳櫒瀹樻垚鍍忔垚涓哄彲鑳斤紝骞惰璁轰簡浠庡尰瀛﹀埌瀹夋涓庡伐涓氱洃娴嬬殑鎸戞垬涓庢満閬囥€?/p>
<p class="body">鐢电鎰熷簲鎴愬儚锛圗MI锛夋槸涓€绉嶅彂灞曟暟鍗佸勾鐨勬垚鐔熸垚鍍忔妧鏈紝宸茶骞挎硾鐢ㄤ簬璇勪及閲戝睘缁撴瀯涓殑瑁傜汗浠ュ強鎺㈡祴鍜屽畾浣嶅煁钘忕殑閲戝睘鐗╀綋銆傚湪鏍囧噯閰嶇疆涓嬶紝EMI鐨勫簲鐢ㄨ寖鍥村洜浼犳劅绾垮湀鍦ㄤ綆棰戜笅鐏垫晱搴﹁緝宸€屽彈鍒颁弗閲嶉檺鍒讹紝杩欎娇鍏舵棤娉曞紑灞曢渶瑕佷綆棰戝伐浣滄垨鏋侀珮鐏垫晱搴︾殑鏈夎叮搴旂敤锛屼緥濡傜┛闅滄垚鍍忔垨浜轰綋鍣ㄥ畼鎴愬儚銆?014骞达紝鍒╃敤鍘熷瓙纾佸己璁★紙AM锛変綔涓篍MI浼犳劅鍣ㄧ殑婕旂ず褰诲簳鏀瑰彉浜嗚繖涓€灞€闈紝涓篍MI寮€杈熶簡鏂扮殑鍓嶆櫙锛屽洜涓哄師瀛愮寮鸿鍦ㄤ綆棰戜笅浠嶈兘淇濇寔鏋侀珮鐨勭伒鏁忓害銆傝繖绡囩患杩版枃绔犺€冨療浜咵MI-AM鐨勬渶鏂版妧鏈按骞筹紝骞惰璁轰簡璇ユ妧鏈湪浠庡尰瀛﹀埌瀹夊叏涓庡伐涓氱洃娴嬬瓑璇稿棰嗗煙涓殑鎸戞垬涓庢満閬囥€?/p><details><summary>Abstract (English)</summary><div class="en-abs">Electromagnetic induction imaging (EMI) is a well established imaging technique, developed over several decades. It has been widely used to assess cracks in metallic structures and to detect and localise buried metallic objects. In its standard configuration, EMI鈥檚 remit of application is severely restricted by the poor sensitivity of the sensing coil at low frequency. This prevents the exploration of interesting applications where low-frequency operation and/or extreme sensitivity is required, such as through-barrier imaging or imaging of human organs. The demonstration in 2014 of the use of an atomic magnetometer (AM) as sensor for EMI completely changed this scenario, and opened up new perspectives for EMI, as atomic magnetometers maintain their extreme sensitivity at low frequency. This review article examines the state-of-the-art of EMI-AM and discusses challenges and opportunities of the technology in many sectors, from medicine to security and industrial monitoring.</div></details>

<p class="teaser">鐢―yson灞曞紑缁欏嚭闈炵嚎鎬aynes鈥揅ummings妯″瀷骞冲潎鎸囨暟鍖栧姛鐨勮В鏋愬紡锛屽彂鐜伴珮娓╀綆Kerr寮哄害涓虹粡鍏稿尯銆佷綆娓╅珮Kerr寮哄害涓洪噺瀛愬尯锛孠err闈炵嚎鎬у洜鑰屽彲浣滀负閲忓瓙璧勬簮鍦ㄦ湁闄愭俯搴︿笅鍒╃敤銆?/p>
<p class="body">鎴戜滑鐮旂┒浜咼arzynski绛夊紡閲忓瓙鐗堟湰鐨勭粡鍏告瀬闄愩€傛ā鍨嬮噰鐢ㄩ潪绾挎€aynes鈥揅ummings鍝堝瘑椤块噺锛屽畠鎻忚堪Kerr浠嬭川涓秴瀵煎厜鑵斿唴鐨勫満銆備负璇勪及骞冲潎鎸囨暟鍖栧姛锛屾垜浠簲鐢―yson灞曞紑骞跺湪鐩镐簰浣滅敤缁樻櫙涓畾涔夊姛绠楃銆傜敱姝ゅ緱鍒扮殑瑙ｆ瀽琛ㄨ揪寮忎负鍦ㄩ噺瀛愯寖鐣村唴妫€楠孞arzynski绛夊紡鎻愪緵浜嗘湁鍔涚殑宸ュ叿銆傛垜浠殑璁＄畻缁撴灉鎻ず浜嗕袱涓笉鍚屽尯鍩燂細楂樻俯銆佷綆Kerr寮哄害涓嬬殑缁忓吀鍖哄煙锛屼互鍙婁綆娓┿€侀珮Kerr寮哄害涓嬬殑閲忓瓙鍖哄煙銆傜敱浜庣郴缁熶笌鐑荡澶勪簬骞宠　锛孠err闈炵嚎鎬ч」鐨勫紩鍏ュ洜姝ゆ槸閲忓瓙鍖哄煙褰㈡垚鐨勫師鍥犮€傝繖鍙嶈繃鏉ュ彲琚瀹氫负涓€绉嶉噺瀛愯祫婧愶紝鐢ㄤ簬鍦ㄩ潪闆舵俯搴︾幆澧冧腑鑾峰緱閲忓瓙璁＄畻涓婄殑浼樺娍銆?/p><details><summary>Abstract (English)</summary><div class="en-abs">We investigate the classical limit of a quantum version of Jarzynski equality. Our model is the nonlinear Jaynes鈥揅ummings Hamiltonian, which represents a field within a superconducting optical cavity in a Kerr medium. To assess the averaged exponentiated work, we apply a Dyson expansion and define the work operator in the interaction picture. The resulting analytical expression provides a powerful tool for examining the Jarzynski equality in the quantum domain. Our computational results reveal two distinct regimes: a classical one for high temperatures and low Kerr intensities, and a quantum one for low temperatures and high Kerr intensities. Because the system is in equilibrium with the thermal bath, the introduction of the Kerr nonlinearity term is therefore responsible for the quantum regime. This in turn can be identified as a quantum resource and used to gain advantages in quantum computing in a non-zero temperature environment.</div></details>

<p class="teaser">缁艰堪鏋佹€у垎瀛愭縺鍏夊喎鍗翠笌淇樿幏鐨勬渶鏂拌繘灞曪紝娑电洊纾佸厜鍥氱銆佷簹澶氭櫘鍕掑喎鍗翠笌闀垮鍛藉洑绂侊紝閲嶇偣璁ㄨ鐩哥┖闂村瘑搴︾殑鎻愬崌锛屼互鍙婅繄鍚戞縺鍏夊喎鍗村垎瀛愮幓鑹测€撶埍鍥犳柉鍧﹀嚌鑱氭墍闈复鐨勬寫鎴樹笌鍙兘鐨勮矾寰勩€?/p>
<p class="body">杩囧幓鍗佸勾闂达紝鏋佹€у垎瀛愮殑婵€鍏夊喎鍗翠笌淇樿幏鍙栧緱浜嗘樉钁楄繘灞曪紝浣垮叾鍦ㄩ噺瀛愪俊鎭€侀噺瀛愬寲瀛﹀拰绮惧瘑娴嬮噺涓殑搴旂敤鎴愪负鍙兘銆傛縺鍏夊喎鍗淬€佺鍏夊洑绂併€佷簹澶氭櫘鍕掑喎鍗翠互鍙婃瀬鎬у垎瀛愮殑闀垮鍛藉洑绂佺瓑鎶€鏈潎宸叉垚鍔熸紨绀恒€傛湰缁艰堪閲嶇偣浠嬬粛浜嗚嫢骞插叧閿垚鏋滐紝鍖呮嫭鍦ㄧ浉绌洪棿瀵嗗害鏂归潰鐨勮繘灞曪紝鍏堕暱鏈熺洰鏍囨槸瀹炵幇婵€鍏夊喎鍗村垎瀛愮殑鐜昏壊鈥撶埍鍥犳柉鍧﹀嚌鑱氥€傛垜浠璁轰簡褰撳墠闈复鐨勬寫鎴樹互鍙婅揪鎴愯繖涓€閲岀▼纰戠殑鍙兘绛栫暐銆?/p><details><summary>Abstract (English)</summary><div class="en-abs">Laser cooling and trapping of polar molecules has seen remarkable progress in the past decade, enabling applications in quantum information, quantum chemistry, and precision measurements. Techniques such as laser cooling, magneto-optical trapping, sub-Doppler cooling, and long-lifetime trapping of polar molecules have been successfully demonstrated. This review highlights key achievements, including advancements in phase space density, with the long-term objective of achieving Bose鈥揈instein condensation in laser-cooled molecules. We discuss the current challenges and potential strategies for reaching this milestone.</div></details>
